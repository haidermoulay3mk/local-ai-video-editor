name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please don't attach private footage, API keys or anything from your Claude account.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
      placeholder: "I uploaded a 2-minute MP4, asked Claude to add captions, and the preview stayed black…"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. New video → Short / Reel
        2. Drop a file…
        3. …
  - type: textarea
    id: log
    attributes:
      label: Error text
      description: Any error shown in the app, or the last lines of the window where `bun start` runs.
      render: text
  - type: input
    id: env
    attributes:
      label: Windows, Bun, Node and Claude Code versions
      placeholder: "Windows 11 23H2 · bun 1.3.14 · node 24.x · claude 2.x"
    validations:
      required: true
