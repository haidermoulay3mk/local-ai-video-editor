name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The editor targets Windows (setup downloads Windows builds of ffmpeg / whisper.cpp).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Unit tests
        run: bun test
