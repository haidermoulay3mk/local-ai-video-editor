# Reviews every pull request with AI Code Checker (https://github.com/haidermoulay3mk/ai-code-checker):
# explains the change, flags code that doesn't belong or doesn't exist, and suggests fixes.
# It only comments; it never approves or merges. Needs the repository secret ANTHROPIC_API_KEY
# for the Claude review; without it, only the automatic checks run.
name: AI Code Checker

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

# A newer push replaces a review still running for an older one, so the PR never gets two summaries.
concurrency:
  group: ai-code-checker-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      # Tests already run in ci.yml on Windows, so the checker doesn't run them again.
      - uses: haidermoulay3mk/ai-code-checker@main
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Trial: report only, never block a merge.
          fail-on: never
